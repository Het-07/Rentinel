[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rentinel"
version = "0.1.0"
description = "Multi-agent rental-listing fraud investigator with a prompt-injection firewall"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "rank-bm25>=0.2.2",
  "pillow>=10",
  "imagehash>=4.3",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2,<3"]

[project.scripts]
rentinel-mcp = "rentinel.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rentinel = ["knowledge/*.yaml", "data/*.csv", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
